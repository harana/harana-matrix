[package]
name = "client-matrix-ffi"
version = "0.18.0"
edition = "2024"
homepage = "https://github.com/matrix-org/matrix-rust-sdk"
keywords = ["matrix", "chat", "messaging", "ffi"]
license = "Apache-2.0"
readme = "README.md"
rust-version.workspace = true
repository = "https://github.com/matrix-org/matrix-rust-sdk"
publish = false

[package.metadata.release]
release = true

[lib]
crate-type = [
  # Needed by uniffi for Android bindings
  "cdylib",
  # Needed by uniffi for iOS bindings
  "staticlib",
  # Needed by uniffi for JS/Wasm bindings, which use rust as an intermediate language
  "lib"
]

[features]
# The rustls crypto provider is not listed here: it is picked per target in the
# `[target.…]` sections below, aws-lc-rs everywhere but on Android. Both
# `rustls-aws-lc-rs` and `rustls-ring` remain available to override that.
default = ["bundled-sqlite", "unstable-msc4274", "experimental-element-recent-emojis", "experimental-push-secrets", "experimental-search"]
experimental-search = ["harana-matrix-client/experimental-search"]
# Use SQLite for the session storage.
sqlite = ["harana-matrix-client/sqlite"]
# Use an embedded version of SQLite.
bundled-sqlite = ["sqlite", "harana-matrix-client/bundled-sqlite"]
# Use IndexedDB for the session storage.
indexeddb = ["harana-matrix-client/indexeddb"]
unstable-msc4274 = ["harana-matrix-client/unstable-msc4274"]
# Required when targeting a Javascript environment, like Wasm in a browser.
js = ["harana-matrix-client/js"]
# Enable sentry error monitoring, not compatible with Wasm platforms.
sentry = ["dep:sentry", "dep:sentry-tracing"]

experimental-element-recent-emojis = ["harana-matrix-client/experimental-element-recent-emojis"]
experimental-push-secrets = ["harana-matrix-client/experimental-push-secrets"]
experimental-x509-identity-verification = ["harana-matrix-client/experimental-x509-identity-verification"]

# Disable the minimum rotation period of Megolm sessions (room keys), this is
# used by complement-crypto, **DO NOT** enable if you're not complement-crypto.
_only-for-testing-disable-megolm-minimum-rotation-period-ms = ["harana-matrix-client/_disable-minimum-rotation-period-ms"]

rustls-aws-lc-rs = ["harana-matrix-client/rustls-aws-lc-rs"]

# Use ring rather than aws-lc-rs as the rustls crypto provider. This is what
# Android builds use: aws-lc-rs crashes client initialisation on some Android
# targets and emulators, 16 KB page size arm64 among them.
rustls-ring = ["harana-matrix-client/rustls-ring"]

[dependencies]
anyhow.workspace = true
# Required by uniffi for the async methods of callback interfaces.
async-trait.workspace = true
chrono.workspace = true
extension-trait = "1.0.2"
eyeball-im.workspace = true
futures-util.workspace = true
language-tags = "0.3.2"
log-panics = { version = "2.1.0", default-features = false, features = ["with-backtrace"] }
http.workspace = true
harana-matrix-client = { workspace = true, features = ["anyhow", "e2e-encryption", "experimental-widgets", "markdown", "socks", "uniffi", "federation-api", "experimental-search", "image-proc", "contentscanner", "unstable-msc4426", "ui", "_crypto"] }
mime = { version = "0.3.17", default-features = false }
harana-matrix-macros.workspace = true
harana-matrix-common = { workspace = true, features = [
    "html",
    "unstable-msc3488",
    "compat-unset-avatar",
    "unstable-msc3245-v1-compat",
    "unstable-msc4278",
    "unstable-msc3230",
    # Audio event type
    "unstable-msc3927",
    # File event type
    "unstable-msc3551",
    # Image event type
    "unstable-msc3552",
    # Video event type
    "unstable-msc3553",
    # Voice event type
    "unstable-msc3245",
    # Emote event type
    "unstable-msc3954",
    # Room language event type
    "unstable-msc4334",
    "unstable-uniffi",
] }
serde.workspace = true
serde_json.workspace = true
sentry = { workspace = true, optional = true, features = [
  # Most default features enabled otherwise.
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "reqwest",
  "sentry-debug-images",
] }
sentry-tracing = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-core.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
uuid = { version = "1.4.1", default-features = false, features = ["std", "v4"] }
zeroize.workspace = true
zxcvbn.workspace = true
oauth2.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = { version = "0.1.7", default-features = false }
tokio = { workspace = true, features = ["sync", "macros"] }
uniffi = { workspace = true, features = ["wasm-unstable-single-threaded"] }
futures-executor.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-compat.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uniffi = { workspace = true, features = ["tokio"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# aws-lc-rs is the rustls crypto provider everywhere but on Android.
harana-matrix-client = { workspace = true, features = ["rustls-aws-lc-rs", "contentscanner", "ui"] }

[target.'cfg(target_os = "android")'.dependencies]
# aws-lc-rs crashes client initialisation on some Android targets and
# emulators (16 KB page size arm64 among them), so Android uses ring instead.
# See https://github.com/matrix-org/matrix-rust-sdk/issues/6442.
harana-matrix-client = { workspace = true, features = ["rustls-ring", "contentscanner", "ui"] }
paranoid-android = { version = "0.2.2", default-features = false }
# Needed for `rustls-platform-verifier`. Newer versions aren't compatible with it.
jni = "0.21.1"
# Used to access the credential storage on Android
rustls-platform-verifier = "0.6.2"
# Needed for intializing and keeping the JavaVM reference around
once_cell = "1.21.4"
# Gobley's jvm-getter is used to get a JVM pointer from all Android versions
jvm-getter = "0.1.0"

[dev-dependencies]
assert_matches2.workspace = true
harana-matrix-client = { workspace = true, features = ["testing", "rustls-aws-lc-rs"] }
similar-asserts.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# The tests never run on Android, and pulling aws-lc-rs in through them would
# put it back into the Android dependency tree.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
harana-matrix-client = { workspace = true, features = ["testing", "rustls-aws-lc-rs"] }
wiremock.workspace = true

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
vergen-gitcl = { workspace = true, features = ["build"] }

[lints]
workspace = true
