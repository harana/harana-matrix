[package]
name = "matrix-sdk-state-res"
description = "Asynchronous, store-backed adapters over Ruma's Matrix state resolution and event authorization"
version = "0.18.0"
authors = ["Harana Contributors"]
edition = "2024"
homepage = "https://github.com/harana/harana-matrix"
keywords = ["matrix", "chat", "messaging", "ruma", "state-resolution"]
license = "Apache-2.0"
readme = "README.md"
rust-version.workspace = true
repository = "https://github.com/harana/harana-matrix"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[dependencies]
# The vendored `ruma` has no `state-res` feature: state resolution lives here, not there.
ruma = { workspace = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
matrix-sdk-test-macros = { path = "../../testing/matrix-sdk-test-macros" }
matrix-sdk-test-utils.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
