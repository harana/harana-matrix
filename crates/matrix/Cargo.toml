[package]
authors = ["Damir Jelić <poljar@termina.org.uk>"]
description = "A high level Matrix client-server library."
edition = "2024"
homepage = "https://github.com/matrix-org/matrix-rust-sdk"
keywords = ["matrix", "chat", "messaging", "ruma", "nio"]
license = "Apache-2.0"
name = "matrix"
readme = "README.md"
repository = "https://github.com/matrix-org/matrix-rust-sdk"
rust-version.workspace = true
version = "0.18.0"

[package.metadata.docs.rs]
features = ["docsrs"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = [
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "reqwest-transport",
    "rustls-aws-lc-rs",
    "tokio-runtime",
]
testing = [
    "sqlite?/testing",
    "indexeddb?/testing",
    "base/testing",
    "wiremock",
    "sdk-test",
    "assert_matches2",
    # The test helpers build clients with the default transport.
    "reqwest-transport",
]

e2e-encryption = [
    "base/e2e-encryption",
    # activate crypto-store on sqlite if given
    "sqlite?/crypto-store",
    # activate on indexeddb if given
    "indexeddb?/e2e-encryption",
]
js = [
    "sdk-common/js",
    "base/js",
]

sqlite = [
    "dep:sqlite",
    "sqlite?/state-store",
    "sqlite?/event-cache-store",
    "sqlite?/media-store",
]
bundled-sqlite = ["sqlite", "sqlite?/bundled"]
indexeddb = [
    "indexeddb/state-store",
    "indexeddb/event-cache-store",
    "indexeddb/media-store"
]
# Use Tokio as the async runtime, unless another one is installed with
# `sdk_common::runtime::set_runtime()`. Turn this off to build without
# any built-in runtime, and install your own instead.
tokio-runtime = [
    "base/tokio-runtime",
    "sdk-common/tokio-runtime",
    "indexeddb?/tokio-runtime",
    "sqlite?/tokio-runtime",
]

# Send HTTP requests with `reqwest`, which needs a Tokio runtime. Turn this off
# to build without `reqwest` and supply an implementation of
# [`HttpSend`](crate::HttpSend) to `ClientBuilder::http_transport()` instead.
reqwest-transport = ["dep:reqwest", "tokio-runtime"]

# If enabled, reqwest depends on and installs aws-lc-rs as the default crypto
# provider for rustls
rustls-aws-lc-rs = ["reqwest-transport", "reqwest?/rustls"]

# If enabled, ring is installed as the default crypto provider for rustls
# instead of aws-lc-rs. Enable this instead of `rustls-aws-lc-rs` on targets
# where aws-lc-rs misbehaves, notably some Android devices and emulators; see
# https://github.com/matrix-org/matrix-rust-sdk/issues/6442.
rustls-ring = ["reqwest-transport", "reqwest?/rustls-no-provider", "dep:rustls"]

qrcode = ["e2e-encryption", "base/qrcode"]
automatic-room-key-forwarding = ["e2e-encryption", "base/automatic-room-key-forwarding"]
experimental-send-custom-to-device = ["e2e-encryption", "base/experimental-send-custom-to-device"]

# Enable experimental support for encrypting state events; see
# https://github.com/matrix-org/matrix-rust-sdk/issues/5397.
experimental-encrypted-state-events = [
    "e2e-encryption",
    "base/experimental-encrypted-state-events",
    "sqlite?/experimental-encrypted-state-events",
    "sdk-test?/experimental-encrypted-state-events",
]

experimental-push-secrets = [
    "e2e-encryption",
    "base/experimental-push-secrets",
    "sqlite?/experimental-push-secrets",
    "indexeddb?/experimental-push-secrets",
    "ruma/unstable-msc4385",
]

markdown = ["dep:pulldown-cmark", "ruma/markdown"]
socks = ["reqwest-transport", "reqwest?/socks"]
# Requires a Tokio runtime: the local HTTP server is built on `axum`, which
# only speaks Tokio.
local-server = ["dep:axum", "dep:rand", "dep:tower", "tokio/net", "tokio/rt"]
sso-login = ["local-server"]
# Enable methods that make calls to the federation API.
federation-api = ["ruma/federation-api"]

uniffi = ["dep:uniffi", "base/uniffi", "dep:matrix-ffi-macros"]

experimental-widgets = ["dep:uuid", "experimental-send-custom-to-device"]

docsrs = ["e2e-encryption", "sqlite", "indexeddb", "sso-login", "qrcode", "federation-api"]

# Add support for inline media galleries via msgtypes
unstable-msc4274 = ["ruma/unstable-msc4274", "base/unstable-msc4274"]

# Add support for user status profile fields (m.status, m.call).
unstable-msc4426 = ["base/unstable-msc4426"]

# Message search with the built-in Tantivy backend.
experimental-search = ["experimental-search-core", "search?/tantivy"]

# The pluggable message search plumbing, without a built-in backend: install
# your own with `ClientBuilder::search_index_provider`.
experimental-search-core = ["dep:search"]

experimental-element-recent-emojis = ["base/experimental-element-recent-emojis"]

experimental-x509-identity-verification = ["e2e-encryption", "base/experimental-x509-identity-verification"]

# Decode images during upload preprocessing, to compute their BlurHash. This
# pulls in an image decoder, so it is off by default.
image-proc = ["dep:blurhash", "dep:image"]

[dependencies]
anyhow = { workspace = true, optional = true }
anymap2 = { version = "0.13.0", default-features = false }
as_variant.workspace = true
assert_matches2 = { workspace = true, optional = true }
async-channel = "2.5.0"
async-stream.workspace = true
async-trait.workspace = true
axum = { version = "0.8.9", optional = true }
blurhash = { version = "0.2.3", default-features = false, optional = true }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
bytesize = { version = "2.4.2", default-features = false, features = ["std"] }
cfg-if.workspace = true
event-listener = "5.4.2"
eyeball.workspace = true
eyeball-im.workspace = true
eyre = { version = "0.6.12", optional = true }
futures-core.workspace = true
futures-util = { workspace = true, features = ["async-await-macro"] }
hex = "0.4.3"
http.workspace = true
imbl = { workspace = true, features = ["serde"] }
# Only the codecs `image-proc` can strip metadata from, to keep the build small.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
indexmap.workspace = true
itertools.workspace = true
js_int = "0.2.2"
language-tags = { version = "0.3.2" }
base.workspace = true
sdk-common.workspace = true
matrix-ffi-macros = { workspace = true, optional = true }
indexeddb = { workspace = true, optional = true }
search = { workspace = true, optional = true }
sqlite = { workspace = true, optional = true }
sdk-test = { workspace = true, optional = true }
mime.workspace = true
mime2ext = "0.1.54"
oauth2.workspace = true
percent-encoding = "2.3.2"
pin-project-lite.workspace = true
pulldown-cmark = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
ruma = { workspace = true, features = [
    "rand",
    "unstable-msc2448",
    "unstable-msc3930",
    "unstable-msc3245-v1-compat",
    "unstable-msc4108",
    "unstable-msc4278",
    "unstable-msc4262",
] }
serde.workspace = true
serde_html_form.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"], optional = true }
tracing = { workspace = true, features = ["attributes"] }
uniffi = { workspace = true, optional = true }
url = { workspace = true, features = ["serde"] }
urlencoding = "2.1.3"
rustls = { workspace = true, optional = true, features = ["logging", "ring", "std", "tls12"] }
uuid = { workspace = true, features = ["serde", "v4"], optional = true }
vodozemac.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
backon = { version = "1.6.0", default-features = false, features = ["std"] }
# only activate reqwest's stream feature on non-wasm, the wasm part seems to not
# support *sending* streams, which makes it useless for us.
reqwest = { workspace = true, optional = true, features = ["stream", "gzip", "http2", "rustls-no-provider"] }
tokio = { workspace = true, features = ["macros"] }
wiremock = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { workspace = true, features = ["futures"] }
reqwest = { workspace = true, optional = true, features = ["gzip", "http2", "rustls-no-provider"] }
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
anyhow.workspace = true
assert-json-diff.workspace = true
assert_matches.workspace = true
assert_matches2.workspace = true
dirs = "6.0.0"
futures-executor.workspace = true
insta.workspace = true
base = { workspace = true, features = ["testing"] }
sdk-test.workspace = true
sdk-test-utils.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
serde_urlencoded = "0.7.1"
similar-asserts.workspace = true
stream_assert.workspace = true
tokio-test = "0.4.5"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ctor = "1.0.12"
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[[test]]
name = "integration"
required-features = ["testing"]

[lints]
workspace = true
