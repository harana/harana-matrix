[package]
authors = ["Damir Jelić <poljar@termina.org.uk>"]
description = "The base component to build a Matrix client library."
edition = "2024"
homepage = "https://github.com/matrix-org/matrix-rust-sdk"
keywords = ["matrix", "chat", "messaging", "ruma", "nio"]
license = "Apache-2.0"
name = "base"
readme = "README.md"
repository = "https://github.com/matrix-org/matrix-rust-sdk"
rust-version.workspace = true
version = "0.18.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = ["tokio-runtime"]
e2e-encryption = ["dep:crypto"]
js = [
    "sdk-common/js",
    "crypto?/js",
    "ruma/js",
    "store-encryption/js",
]
qrcode = ["crypto?/qrcode"]
automatic-room-key-forwarding = [
    "crypto?/automatic-room-key-forwarding",
]
experimental-send-custom-to-device = [
    "crypto?/experimental-send-custom-to-device",
]

# Enable experimental support for encrypting state events; see
# https://github.com/matrix-org/matrix-rust-sdk/issues/5397.
experimental-encrypted-state-events = [
    "e2e-encryption",
    "ruma/unstable-msc4362",
    "crypto?/experimental-encrypted-state-events"
]

# Enable experimental support for pushing secrets
experimental-push-secrets = [
    "e2e-encryption",
    "crypto?/experimental-push-secrets"
]

uniffi = ["dep:uniffi", "crypto?/uniffi", "sdk-common/uniffi"]

# Private feature, see
# https://github.com/matrix-org/matrix-rust-sdk/pull/3749#issuecomment-2312939823 for the gory
# details.
test-send-sync = [
    "sdk-common/test-send-sync",
    "crypto?/test-send-sync",
]

# helpers for testing features build upon this
testing = [
    "dep:assert_matches",
    "dep:assert_matches2",
    "dep:http",
    "dep:sdk-test",
    "crypto?/testing",
]

# Add support for inline media galleries via msgtypes
unstable-msc4274 = []

# Add support for user status profile fields (m.status, m.call).
unstable-msc4426 = ["ruma/unstable-msc4426"]

experimental-element-recent-emojis = []
experimental-x509-identity-verification = ["e2e-encryption", "crypto/experimental-x509-identity-verification"]

# Use Tokio as the async runtime, unless another one is installed with
# `sdk_common::runtime::set_runtime()`. Turn this off to build without
# any built-in runtime, and install your own instead.
tokio-runtime = ["sdk-common/tokio-runtime", "crypto?/tokio-runtime"]

[dependencies]
as_variant.workspace = true
assert_matches = { workspace = true, optional = true }
assert_matches2 = { workspace = true, optional = true }
async-trait.workspace = true
bitflags = { workspace = true, features = ["serde"] }
decancer = { version = "3.3.3", default-features = false }
eyeball = { workspace = true, features = ["async-lock"] }
eyeball-im.workspace = true
futures-util.workspace = true
growable-bloom-filter.workspace = true
http = { workspace = true, optional = true }
sdk-common.workspace = true
crypto = { workspace = true, optional = true }
store-encryption.workspace = true
sdk-test = { workspace = true, optional = true }
regex.workspace = true
ruma = { workspace = true, features = [
    "unstable-msc2867",
    "unstable-msc3381",
    "unstable-msc4186",
    "unstable-msc4262",
    "rand",
] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
uniffi = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
assert_matches.workspace = true
assert_matches2.workspace = true
assign = "1.1.1"
futures-executor.workspace = true
http.workspace = true
sdk-test.workspace = true
sdk-test-utils.workspace = true
proptest.workspace = true
similar-asserts.workspace = true
stream_assert.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test.workspace = true
getrandom3 = { version = "0.3.4", package = "getrandom", default-features = false, features = ["wasm_js"] }
gloo-timers = { workspace = true, features = ["futures"] }

[lints]
workspace = true
