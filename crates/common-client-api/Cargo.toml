[package]
name = "common-client-api"
version = "0.16.0"
description = "Serializable types for the endpoints in the Matrix client-server API."
categories = ["api-bindings", "web-programming"]
keywords = ["matrix", "chat", "messaging", "ruma"]
license = "MIT"
repository = "https://github.com/ruma/ruma"
edition = "2024"
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
default = []

# `OutgoingRequest` / `IncomingResponse` impls, for code talking to a homeserver.
client = ["common-types/client"]
# `IncomingRequest` / `OutgoingResponse` impls, for code answering requests.
server = ["common-types/server"]

# Allow some mandatory fields to be missing, defaulting them to an empty string.
compat-empty-string-null = ["common-types/compat-empty-string-null", "common-events/compat-empty-string-null"]
# Unset avatars by sending an empty string, same as what Element Web does, c.f.
# https://github.com/matrix-org/matrix-spec/issues/378#issuecomment-1055831264
compat-unset-avatar = []
# Always serialize the threepids response field in `get_3pids::v3::Response`.
compat-get-3pids = []
# Accept `message` as an alias for `error` in `upload_signatures::v3::Failure`, as Synapse sends.
compat-upload-signatures = []
# unstable: by using any of the below features, you opt out of all semver guarantees
#           that Ruma otherwise provides!
# Ignore name and avatar fields of rooms and hero users in a sync v5 response if they fail to
# deserialize.
unstable-compat-lax-syncv5-deser = ["unstable-msc4186"]
unstable-msc1763 = ["common-events/unstable-msc1763"]
unstable-msc1767 = ["common-events/unstable-msc1767"]
unstable-msc2448 = ["common-events/unstable-msc2448"]
unstable-msc2654 = []
unstable-msc3488 = ["unstable-msc1767", "common-events/unstable-msc3488"]
unstable-msc3814 = []
unstable-msc3834 = ["common-types/unstable-msc3834", "common-events/unstable-msc3834"]
unstable-msc3983 = []
unstable-msc4108 = ["common-types/unstable-msc4108"]
unstable-msc4121 = []
unstable-msc4140 = ["common-types/unstable-msc4140"]
unstable-msc4143 = []
unstable-msc4186 = ["common-types/unstable-msc4186"]
unstable-msc4195 = ["unstable-msc4143"]
# Profile Updates Sliding Sync Extension
unstable-msc4262 = ["common-types/unstable-msc4262"]
unstable-msc4293 = ["common-events/unstable-msc4293"]
# Thread subscription support.
unstable-msc4306 = ["common-types/unstable-msc4306"]
unstable-msc4308 = []
# Sticky Events
unstable-msc4354 = ["common-events/unstable-msc4354"]
unstable-msc4383 = []
# Secure out-of-band channel for QR code sign in
unstable-msc4388 = ["common-types/unstable-msc4388"]
unstable-msc4439 = []
unstable-msc4466 = []
unstable-msc4480 = ["unstable-msc4354"]

[dependencies]
common-types = { path = "../common-types" }
common-events = { path = "../common-events" }
as_variant.workspace = true
assign = "1.1.1"
bytes = "1.11.1"
http = { workspace = true, features = ["std"] }
js_int = { version = "0.2.2", features = ["serde"] }
js_option = "0.2.0"
maplit = "1.0.2"
serde.workspace = true
serde_html_form = "0.4.1"
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
time = "0.3.47"
url = { workspace = true, features = ["serde"] }
web-time = "1.1.0"

[dev-dependencies]
assert_matches2.workspace = true
common-ruma = { path = "../common-ruma", features = ["full"] }

[lints]
workspace = true
