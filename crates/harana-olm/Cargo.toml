[package]
authors = [
    "Damir Jelić <poljar@termina.org.uk>",
    "Denis Kasak <dkasak@termina.org.uk>",
]
name = "vodozemac"
description = "A Rust implementation of Olm and Megolm, vendored from the harana-olm fork"
repository = "https://github.com/harana/harana-olm"
version = "0.10.0"
edition = "2024"
keywords = ["matrix", "chat", "messaging", "olm", "cryptography"]
license = "Apache-2.0"
readme = "README.md"
# Upstream declares 1.85, but this crate is only consumed by this
# workspace, so it tracks the workspace MSRV.
rust-version.workspace = true
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `getrandom` carries no direct `use` in this crate, it is pulled in so that the
# `wasm_js` feature can forward to it.
[package.metadata.cargo-machete]
ignored = ["getrandom"]

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(fuzzing)'] }
unsafe_code = "deny"
missing_docs = "deny"
dead_code = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"
rust_2018_idioms = "deny"

[lints.clippy]
panic = "deny"
unreachable = "deny"
expect_used = "deny"
unwrap_used = "deny"
mem_forget = "deny"

[features]
default = ["libolm-compat", "precomputed-tables"]
wasm_js = ["getrandom/wasm_js"]
libolm-compat = []
# Enables curve25519-dalek's precomputed basepoint tables, speeding up
# fixed-base scalar multiplication (key generation and Ed25519 signing) at the
# cost of embedding ~40 KB of lookup tables in the final binary.
precomputed-tables = ["curve25519-dalek/precomputed-tables"]
insecure-pk-encryption = ["libolm-compat"]
experimental-session-config = []
# The low-level-api feature exposes extra APIs that are only useful in advanced
# use cases and require extra care to use.
low-level-api = []

[dependencies]
aes = { version = "0.9.1" }
arrayvec = { version = "0.7.8", features = ["serde"] }
# Pinned to 0.22 rather than the workspace's 0.23: `base64::DecodeError` is part
# of this crate's public API and the encoding engines are used verbatim from
# upstream.
base64 = "0.22.1"
base64ct = { version = "1.8.3", features = ["std", "alloc"] }
cbc = { version = "0.2.1" }
chacha20poly1305 = "0.11.0"
cipher = { version = "0.5.2", features = ["alloc"] }
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["rand_core", "serde", "hazmat", "zeroize"] }
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
matrix-pickle = { version = "0.2.3" }
prost = "0.14.4"
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6.1"
thiserror.workspace = true
x25519-dalek = { version = "3.0.0", default-features = false, features = ["serde", "reusable_secrets", "static_secrets", "zeroize"] }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
anyhow.workspace = true
assert_matches2.workspace = true
insta.workspace = true
ntest = "0.9.5"
olm-rs = "2.2.0"
proptest.workspace = true
