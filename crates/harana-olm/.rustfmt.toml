# Mirrors the rustfmt configuration of https://github.com/harana/harana-olm so
# that `src/` stays byte-identical with upstream and can be re-synced verbatim.
# Workaround for https://github.com/rust-lang/rust.vim/issues/464
edition = "2024"
max_width = 100
comment_width = 80
wrap_comments = true
imports_granularity = "Crate"
use_small_heuristics = "Max"
group_imports = "StdExternalCrate"

ignore = [
    "afl/*/in/*",
]
