[package]
name = "server-appservice"
description = "Application service registration and namespace matching for Matrix"
version = "0.18.0"
authors = ["Harana Contributors"]
edition = "2024"
homepage = "https://github.com/harana/harana-matrix"
keywords = ["matrix", "chat", "messaging", "ruma", "appservice"]
license = "Apache-2.0"
readme = "README.md"
rust-version.workspace = true
repository = "https://github.com/harana/harana-matrix"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[dependencies]
# `unicode-case` is what makes the case-insensitive namespace matching work;
# the workspace default enables `unicode-perl` only.
regex = { workspace = true, features = ["unicode-case"] }
common-ruma = { workspace = true, features = ["appservice-api-s"] }
thiserror.workspace = true

[lints]
workspace = true
