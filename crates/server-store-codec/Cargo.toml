[package]
name = "server-store-codec"
description = "A compact, order-preserving binary codec for key-value store records"
version = "0.18.0"
authors = ["Harana Contributors"]
edition = "2024"
homepage = "https://github.com/harana/harana-matrix"
keywords = ["matrix", "serde", "serialization", "database", "storage"]
license = "Apache-2.0"
readme = "README.md"
rust-version.workspace = true
repository = "https://github.com/harana/harana-matrix"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[dependencies]
arrayvec = "0.7.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
