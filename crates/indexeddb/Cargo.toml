[package]
name = "indexeddb"
version = "0.18.0"
repository = "https://github.com/matrix-org/matrix-rust-sdk"
description = "Web's IndexedDB Storage backend for matrix"
license = "Apache-2.0"
edition = "2024"
rust-version.workspace = true
readme = "README.md"

[package.metadata.cargo-machete]
ignored = ["serde_bytes"] # Used in the indexed types, by the IndexedMediaContentData (aka media content).

[package.metadata.docs.rs]
all-features = true
default-target = "wasm32-unknown-unknown"
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = ["e2e-encryption", "state-store", "event-cache-store", "media-store", "tokio-runtime"]
event-cache-store = ["dep:base", "media-store", "indexed-type-serializer"]
media-store = ["dep:base", "indexed-type-serializer"]
state-store = ["dep:base", "growable-bloom-filter", "safe-encode-traits"]
e2e-encryption = ["dep:base", "dep:crypto", "safe-encode-serializer"]
safe-encode-traits = []
safe-encode-serializer = ["dep:crypto", "safe-encode-traits"]
indexed-type-serializer = ["safe-encode-serializer"]
testing = ["crypto?/testing"]
experimental-encrypted-state-events = [
    "crypto?/experimental-encrypted-state-events"
]
experimental-push-secrets = [
    "crypto?/experimental-push-secrets"
]

# Use Tokio as the async runtime, unless another one is installed with
# `sdk_common::runtime::set_runtime()`. Turn this off to build without
# any built-in runtime, and install your own instead.
tokio-runtime = [
    "sdk-common/tokio-runtime",
    "base?/tokio-runtime",
    "crypto?/tokio-runtime",
]

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
gloo-utils.workspace = true
growable-bloom-filter = { workspace = true, optional = true }
hkdf.workspace = true
indexed_db_futures = { workspace = true, features = [
    "serde",
    "cursors",
    "indices",
    "streams",
]}
js-sys.workspace = true
base = { workspace = true, features = ["js"], optional = true }
crypto = { workspace = true, features = ["js"], optional = true }
store-encryption.workspace = true
rmp-serde.workspace = true
ruma.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde-wasm-bindgen = { version = "0.6.5", default-features = false }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["js", "serde", "v4"] }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["IdbKeyRange"] }
zeroize.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# for wasm32 we need to activate this
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
assert_matches.workspace = true
assert_matches2.workspace = true
gloo-timers = { workspace = true, features = ["futures"] }
base = { workspace = true, features = ["testing"] }
sdk-common = { workspace = true, features = ["js"] }
crypto = { workspace = true, features = ["js", "testing"] }
sdk-test.workspace = true
rand.workspace = true
tracing-subscriber = { workspace = true, features = [
    "registry",
    "tracing-log",
] }
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = [
    "IdbKeyRange",
    "Window",
    "Performance",
] }

[lints]
workspace = true
