[package]
authors = ["Damir Jelić <poljar@termina.org.uk>"]
description = "Helpers to write tests for the Matrix SDK"
edition = "2024"
homepage = "https://github.com/matrix-org/matrix-rust-sdk"
keywords = ["matrix", "chat", "messaging", "ruma"]
license = "Apache-2.0"
name = "common-test"
readme = "README.md"
repository = "https://github.com/matrix-org/matrix-rust-sdk"
rust-version.workspace = true
version = "0.18.0"

[package.metadata.release]
release = true

[lib]
test = false
doctest = false

[features]
experimental-encrypted-state-events = ["harana-matrix-common/unstable-msc4362"]

[dependencies]
as_variant.workspace = true
http.workspace = true
insta.workspace = true
client-common = { version = "0.18.0", path = "../../crates/client-common" }
harana-matrix-macros.workspace = true
# Enable the unstable feature for polls support.
# "server" is needed to serialize Response objects to JSON.
harana-matrix-common = { workspace = true, features = [
    "server",
    "rand",
    "unstable-msc3381",
    "unstable-msc4274",
    "olm",
    "insecure-pk-encryption",
    "experimental-session-config",
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ctor = "0.2.9"
tokio = { workspace = true, features = ["rt", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wiremock.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen-test.workspace = true

[lints]
workspace = true
