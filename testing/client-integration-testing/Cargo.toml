[package]
name = "client-integration-testing"
description = "Internal integration testing for matrix crate"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version.workspace = true

[package.metadata.release]
release = false

[features]
default = []

# Enable experimental support for encrypting state events; see
# https://github.com/matrix-org/matrix-rust-sdk/issues/5397.
experimental-encrypted-state-events = [
    "client-matrix/experimental-encrypted-state-events",
    "client-base/experimental-encrypted-state-events"
]

[dev-dependencies]
anyhow.workspace = true
as_variant.workspace = true
assert_matches.workspace = true
assert_matches2.workspace = true
assign = "1"
eyeball.workspace = true
eyeball-im.workspace = true
futures = { version = "0.3.29", features = ["executor"] }
futures-core.workspace = true
futures-util.workspace = true
http.workspace = true
json-structural-diff = "0.2.0"
client-matrix = { workspace = true, default-features = true, features = ["sqlite", "testing", "qrcode", "experimental-x509-identity-verification"] }
client-base = { workspace = true, default-features = true, features = ["testing", "qrcode", "experimental-x509-identity-verification"] }
client-crypto = { workspace = true, features = ["rust-x509-verifier-impl"] }
client-common.workspace = true
common-test.workspace = true
common-test-utils.workspace = true
client-ui = { workspace = true, default-features = true }
rand.workspace = true
rcgen = { workspace = true, features = ["aws_lc_rs", "pem", "x509-parser"] }
reqwest.workspace = true
rustls = { version = "0.23.42", default-features = false, features = ["aws_lc_rs"] }
serde_json.workspace = true
sha2.workspace = true
similar-asserts.workspace = true
stream_assert.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tracing.workspace = true
wiremock.workspace = true

[lints]
workspace = true
